<!doctype html><meta charset="utf-8"><title>shim-selftest</title>
<!--
  Firestore-shim (sb/firebase-firestore.js) tarjima mantig'ini JONLI Supabase'siz
  sinaydi: esm.sh import map orqali lokal stub'ga almashtiriladi, soxta mijoz
  chaqiruvlar zanjirini yozib boradi. Repo ildizidan statik server bilan oching:
     python3 -m http.server 8799
     # keyin: http://localhost:8799/migration/shim-selftest.html
  yoki:  node migration/run-shim-test.cjs   (Playwright bilan avtomatik)
-->
<script type="importmap">
{ "imports": { "https://esm.sh/@supabase/supabase-js@2": "/migration/_esm-stub.js" } }
</script>
<pre id="out">running…</pre>
<script type="module">
import { _setClient } from "/sb/_core.js";
import * as FS from "/sb/firebase-firestore.js";

const log = [];
let fails = 0;
const ok = (c, m) => { log.push((c ? "✓ " : "✗ FAIL ") + m); if (!c) fails++; };
const eq = (a, b, m) => ok(JSON.stringify(a) === JSON.stringify(b), m + "  (got " + JSON.stringify(a) + ")");

let REC = null, CANNED = [];
function makeBuilder() {
  const rec = { ops: [] };
  const b = {
    select(x) { rec.ops.push(["select", x]); return b; },
    eq(f, v) { rec.ops.push(["eq", f, v]); return b; },
    neq(f, v) { rec.ops.push(["neq", f, v]); return b; },
    gt(f, v) { rec.ops.push(["gt", f, v]); return b; },
    gte(f, v) { rec.ops.push(["gte", f, v]); return b; },
    lt(f, v) { rec.ops.push(["lt", f, v]); return b; },
    lte(f, v) { rec.ops.push(["lte", f, v]); return b; },
    in(f, v) { rec.ops.push(["in", f, v]); return b; },
    contains(f, v) { rec.ops.push(["contains", f, v]); return b; },
    order(f, o) { rec.ops.push(["order", f, o]); return b; },
    limit(n) { rec.ops.push(["limit", n]); return b; },
    upsert(obj, o) { rec.ops.push(["upsert", obj, o]); return b; },
    insert(obj) { rec.ops.push(["insert", obj]); return b; },
    update(obj) { rec.ops.push(["update", obj]); return b; },
    delete() { rec.ops.push(["delete"]); return b; },
    maybeSingle() { rec.single = true; return Promise.resolve({ data: CANNED[0] || null, error: null }); },
    then(res) { return Promise.resolve({ data: CANNED, error: null }).then(res); },
  };
  REC = rec;
  return b;
}
const fake = { from(t) { const b = makeBuilder(); REC.table = t; return b; } };
_setClient(fake);

(async () => {
  CANNED = [];
  await FS.getDocs(FS.query(FS.collection(null, "students"),
    FS.where("grade", "==", 9), FS.orderBy("name"), FS.limit(5)));
  eq(REC.table, "students", "getDocs jadval = students");
  eq(REC.ops, [["select", "*"], ["eq", "grade", 9], ["order", "name", { ascending: true }], ["limit", 5]],
    "where('=='), orderBy(asc), limit tarjimasi");

  await FS.getDocs(FS.query(FS.collection(null, "grades"), FS.where("id", "in", ["a", "b"])));
  eq(REC.ops, [["select", "*"], ["in", "id", ["a", "b"]]], "where('in') -> .in()");
  await FS.getDocs(FS.query(FS.collection(null, "users"), FS.where("childIds", "array-contains", "K1")));
  eq(REC.ops, [["select", "*"], ["contains", "childIds", '["K1"]']], "array-contains -> .contains(JSON)");

  await FS.getDocs(FS.query(FS.collection(null, "news"), FS.orderBy("date", "desc")));
  ok(JSON.stringify(REC.ops).includes('["order","date",{"ascending":false}]'), "orderBy('desc') -> ascending:false");

  CANNED = [{ id: "X1", name: "Ali" }];
  const d = await FS.getDoc(FS.doc(FS.collection(null, "students"), "X1"));
  ok(REC.single === true, "getDoc maybeSingle() ishlatadi");
  ok(d.exists() && d.data().name === "Ali" && d.id === "X1", "getDoc exists()/data()/id");

  CANNED = [{ id: "X1", updatedAt: "2026-01-15T08:30:00+00:00", plain: "salom" }];
  const d2 = await FS.getDoc(FS.doc(FS.collection(null, "x"), "X1"));
  const val = d2.data().updatedAt;
  ok(val && typeof val.toDate === "function" && val.toDate() instanceof Date, "ISO string -> {toDate()} obyekt");
  ok(d2.data().plain === "salom", "oddiy string o'zgarmaydi");

  await FS.setDoc(FS.doc(FS.collection(null, "students"), "S9"),
    { name: "Vali", ts: FS.serverTimestamp(), gone: FS.deleteField() });
  const up = REC.ops.find(x => x[0] === "upsert");
  ok(up[1].id === "S9" && up[1].name === "Vali", "setDoc id+maydon");
  ok(typeof up[1].ts === "string" && /^\d{4}-\d{2}-\d{2}T/.test(up[1].ts), "serverTimestamp -> ISO string");
  ok(up[1].gone === null, "deleteField -> null");
  ok(up[2] && up[2].onConflict === "id", "upsert onConflict=id");

  await FS.addDoc(FS.collection(null, "logs"), { m: "hi" });
  const insOp = REC.ops.find(x => x[0] === "insert");
  ok(insOp && insOp[1].id && insOp[1].m === "hi", "addDoc id yaratadi + maydon");

  await FS.updateDoc(FS.doc(FS.collection(null, "students"), "S9"), { grade: 10 });
  eq(REC.ops, [["update", { grade: 10 }], ["eq", "id", "S9"]], "updateDoc -> update().eq(id)");

  await FS.deleteDoc(FS.doc(FS.collection(null, "students"), "S9"));
  eq(REC.ops, [["delete"], ["eq", "id", "S9"]], "deleteDoc -> delete().eq(id)");

  const b = FS.writeBatch();
  b.set(FS.doc(FS.collection(null, "students"), "B1"), { n: 1 });
  b.update(FS.doc(FS.collection(null, "students"), "B2"), { n: 2 });
  b.delete(FS.doc(FS.collection(null, "students"), "B3"));
  await b.commit();
  ok(true, "writeBatch commit xatosiz o'tdi");

  document.getElementById("out").textContent = log.join("\n") + "\n\n" + (fails ? ("❌ " + fails + " FAILED") : "✅ ALL PASS");
  document.title = fails ? ("FAIL:" + fails) : "PASS";
})().catch(e => {
  document.getElementById("out").textContent = "ERROR: " + (e.stack || e.message);
  document.title = "ERROR";
});
</script>
